- id: q13
  category: safety
  destination: da_nang_hoi_an
  question: Does Hoi An flood? When should I be careful?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - Hoi An regularly floods in November
    - book ahead if visiting during flood season

- id: q14
  category: money
  destination: da_nang_hoi_an
  question: Where can I withdraw cash without ATM fees in Hoi An?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - VP Bank and TP Bank don't charge fees
    - gold shops near the market are good for changing money

- id: q15
  category: practical
  destination: da_nang_hoi_an
  question: How do I get a SIM card in Da Nang?
  expected_source_files:
    - practical-da-nang-travel-guide-2025-the-midnight-blue-elepha.md
  key_facts:
    - available right at Da Nang airport
    - Viettel is a recommended operator
    - an Airalo eSIM is a safer alternative to avoid scam SIMs

- id: q16
  category: culture
  destination: da_nang_hoi_an
  question: Why are so many buildings in Hoi An painted yellow?
  expected_source_files:
    - the-ultimate-guide-to-visit-hoi-an-2025-the-midnight-blue-el.md
    - hoi-an-a-complete-travel-guide-to-the-prettiest-town-in-viet.md
  key_facts:
    - yellow is associated with royalty/luck or prosperity/happiness/harmony
    - yellow also absorbs less heat, practical for the climate
  notes: >
    Corpus tension: the two blogs give slightly different symbolic
    reasons (royalty/luck vs. prosperity/happiness/harmony). Either
    is an acceptable answer; watch for the agent inventing a third,
    unsupported explanation instead of using what's actually there.

- id: q17
  category: activities
