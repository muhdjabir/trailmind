# Eval questions for v0 step 13/14 (see docs/implementation_list.md).
#
# Each entry supports the three scoring axes from step 14:
#   - retrieval quality: does a chunk from `expected_source_files` show up
#     in the tool's top-5 results for this question?
#   - answer quality: does the final answer mention the facts in `key_facts`?
#   - hallucination rate: for `must_not_invent` entries, does the answer
#     avoid specifics that aren't actually in the corpus?
#
# `notes` flags cases worth extra attention: corpus inconsistencies
# between sources, or deliberately adversarial questions.

- id: q01
  category: transport
  destination: da_nang_hoi_an
  question: How do I get from Da Nang airport to Hoi An?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - taxi costs roughly 300,000-500,000 dong
    - shuttle bus costs about 130,000 dong per person
    - the trip takes about 45 minutes

- id: q02
  category: transport
  destination: da_nang_hoi_an
  question: Can I get around Hoi An Old Town by car?
  expected_source_files:
    - the-ultimate-guide-to-visit-hoi-an-2025-the-midnight-blue-el.md
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - cars are not allowed in Old Town
    - walking is the best way to get around
    - motorbikes are restricted at certain times / don't reach everywhere

- id: q03
  category: food
  destination: da_nang_hoi_an
  question: What dishes is Hoi An particularly known for?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - Banh Xeo (crispy pancake)
    - Cao Lau
    - Mi Quang
    - White Rose dumplings (Banh Bao Banh Vac)

- id: q04
  category: food
  destination: da_nang_hoi_an
  question: Where can I get a good cheap banh mi in Hoi An?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - Madam Khanh, "The Banh Mi Queen"
    - located at 115 Tran Cao Van
    - around 25,000-30,000 dong

- id: q05
  category: food
  destination: da_nang_hoi_an
  question: What's a famous noodle soup to try in Da Nang?
  expected_source_files:
    - practical-da-nang-travel-guide-2025-the-midnight-blue-elepha.md
  key_facts:
    - bun cha ca (fishcake noodle soup)
    - Bún chả cá 109 is a recommended spot

- id: q06
  category: shopping
  destination: da_nang_hoi_an
  question: What are good tailor shops in Hoi An, and what should I watch out for?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - Nathan Tailors (127 Tran Hung Dao Street)
    - suits from about US$129
    - avoid Yaly's and Be Be as tourist traps / commission-driven recommendations
    - a deposit of about 25% is usually required
  notes: >
    Corpus tension: the-ultimate-guide-to-visit-hoi-an blog recommends
    Yaly as "one of the best tailors," while the Wikivoyage doc calls it
    a tourist trap. Good check for whether the agent notices/handles
    conflicting sources rather than blending them uncritically.

- id: q07
  category: accommodation
  destination: da_nang_hoi_an
  question: What's a good budget place to stay in Hoi An?
  expected_source_files:
    - hoi-an-travel-guide-at-wikivoyage.md
  key_facts:
    - Melody Boutique Villa (dorms from 90,000 dong)
    - Hoang Trinh Hotel
    - free or cheap bicycles included

- id: q08
  category: accommodation
  destination: da_nang_hoi_an
  question: Which area of Da Nang is best for a first-time visitor to stay in?
  expected_source_files:
