- id: q19
  category: adversarial-empty-corpus
  destination: bangkok
  question: What's the best street food in Bangkok?
  expected_source_files: []
  key_facts: []
  must_not_invent:
    - specific Bangkok street food stall names, prices, or addresses
  notes: >
    Bangkok IS in KNOWN_DESTINATIONS but has no corpus data loaded yet
    (v0 only covers da_nang_hoi_an so far - see implementation_list.md
    step 23). search_destination_knowledge won't error, but will return
    zero snippets. Correct behavior: the agent admits it doesn't have
    specific info rather than inventing plausible-sounding details from
    its own pretraining - this is the sharper hallucination test since
    there's no explicit error to lean on.

