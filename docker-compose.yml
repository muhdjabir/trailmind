services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trailmind-pg
    environment:
      POSTGRES_USER: trailmind
      POSTGRES_PASSWORD: trailmind
      POSTGRES_DB: trailmind
    ports:
      - "5432:5432"
    volumes:
      - trailmind-pg-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build: ./agent
    container_name: trailmind-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trailmind:trailmind@postgres:5432/trailmind
      # Ollama runs natively on the host, not in a container - reach it
      # via Docker's host gateway (extra_hosts below covers Linux too).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Read from the repo-root .env (gitignored) via compose's default
      # env-file substitution - never hardcode the actual key here.
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Whole agent/ so scripts/ and corpus data are runnable via
      # `docker compose exec agent ...`, not just the running service's
      # own app/ code.
      - ./agent:/app

  web:
    build: ./web
    container_name: trailmind-web
    depends_on:
      - agent
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  trailmind-pg-data:
